# Builds the installer package and publishes it as a GitHub release.
#
# - Push a tag vX.Y.Z (= kProductVersion in Sources/GenmaiBase/VersionDef.swift) to build Genmai-X.Y.Z.pkg and
#   create the release with it (release notes generated from the commits). The IME's update check
#   (GenmaiAppRelease.latest) finds it from there.
# - Run the workflow by hand (Actions › Release › Run workflow) to build the package without publishing it; the
#   package is kept as a workflow artifact.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mozc sources (dictionary data)
        run: git submodule update --init --depth 1 Vendor/mozc

      - name: Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          # Needed by Tools/build_mlx_metallib.sh (metal / metallib).
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk macosx metal --version

      - name: Version
        id: version
        run: |
          VERSION=$(sed -n 's/.*kProductVersion = "\(.*\)"/\1/p' Sources/GenmaiBase/VersionDef.swift)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match kProductVersion $VERSION"
            exit 1
          fi

      - name: SwiftPM cache
        uses: actions/cache@v4
        with:
          path: |
            .build-bundle/checkouts
            .build-bundle/repositories
            Data/external
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Tools/build_data.sh') }}

      - name: Data set (genmai-datagen)
        run: Tools/build_data.sh --oss

      - name: Installer package
        run: |
          Tools/make_installer_pkg.sh
          cp build/Genmai.pkg "build/Genmai-${{ steps.version.outputs.version }}.pkg"
          shasum -a 256 "build/Genmai-${{ steps.version.outputs.version }}.pkg"

      - name: Keep the package (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Genmai-${{ steps.version.outputs.version }}
          path: build/Genmai-${{ steps.version.outputs.version }}.pkg

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Genmai-${{ steps.version.outputs.version }}.pkg" \
            --title "Genmai ${{ steps.version.outputs.version }}" --generate-notes --verify-tag
