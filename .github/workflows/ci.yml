# Builds every product and runs the tests on each push to main and on pull requests, with the same Xcode as the
# release workflow (the oldest supported toolchain is where compile errors show up first), and checks
# swift-format (.swift-format; any finding fails). Tests that need the AI
# model skip (it is not downloaded here); the data sets are built with genmai-datagen and cached.
# The tests run in a release build with testing enabled: debug code is ~20x slower and the tests took 45 minutes on
# the runner. The caches are saved even when a step fails (a failing run must not make the next one start over);
# the build cache keeps the dependencies' objects, the package's own modules are rebuilt because the checkout gives
# every source a new mtime.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Mozc sources (dictionary data)
        id: mozc
        run: |
          git submodule update --init --depth 1 Vendor/mozc
          echo "commit=$(git -C Vendor/mozc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Lint (swift-format)
        run: |
          find Sources Tests Package.swift -name '*.swift' -not -path 'Sources/GenmaiProtocol/*' -print0 \
            | xargs -0 xcrun swift-format lint --strict

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build-ci
            .build-datagen
          key: build-ci-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: build-ci-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-

      - name: Restore data sets
        id: data
        uses: actions/cache/restore@v4
        with:
          path: Data
          key: data-${{ runner.os }}-${{ steps.mozc.outputs.commit }}-${{ hashFiles('Tools/build_data.sh', 'Sources/GenmaiDataGen/**') }}

      - name: Data sets (genmai-datagen)
        if: steps.data.outputs.cache-hit != 'true'
        run: Tools/build_data.sh

      - name: Save data sets
        if: steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Data
          key: ${{ steps.data.outputs.cache-primary-key }}

      - name: Build
        run: swift build --build-path .build-ci -c release -Xswiftc -enable-testing --build-tests

      - name: Save build cache
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build-ci
            .build-datagen
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Test
        run: swift test --build-path .build-ci -c release -Xswiftc -enable-testing --skip-build
